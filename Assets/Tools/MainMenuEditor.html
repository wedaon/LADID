  <style>

ts:auto}.sliderPreviewHandle{border-radius:50%;box-shadow:0 0 10px #ffffff66;z-index:4}.globalColor{display:flex;align-items:center;justify-content:space-between;border:1px solid #2d4353;background:#0c151d;padding:7px 9px;border-radius:7px;color:#c5d2dc;font-size:11px;margin:8px 0 12px}.globalColor input{width:44px;height:27px;padding:2px;border:1px solid #355064;border-radius:4px;background:#0b131b}.hintLabel{color:#80a5b9;font-size:10px;margin-top:10px}.empty{color:#708595;font-size:11px;padding:8px}
    .inspector{padding:16px}.inspectorHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.inspectorHead strong{font-size:13px}.danger{color:#ff9b9b;border-color:#6a3940;background:#321e25;padding:5px 8px;font-size:10px}.formField{display:grid;gap:4px;margin:9px 0;color:#b9c9d4;font-size:10px}.formField input,.formField select,.formField textarea{width:100%;min-width:0;height:32px;border:1px solid #2e4353;border-radius:6px;background:#0b131b;color:var(--text);padding:0 8px;font:inherit}.formField textarea{height:64px;resize:vertical;padding:7px}.formField input[type=color]{padding:3px}.formField input[type=range]{accent-color:var(--accent);padding:0}.formField input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.checkField{display:flex;align-items:center;gap:8px;margin:9px 0;color:#c7d4dc;font-size:11px}.rangeRow{display:grid;grid-template-columns:1fr 42px;gap:7px;align-items:center}.rangeRow output{text-align:right;color:var(--accent)}.roleNote{border:1px solid #2d4353;background:#0c151d;color:#8fa9bb;padding:8px;border-radius:6px;font-size:10px;margin:9px 0}.status{min-height:18px;color:var(--accent);font-size:10px;margin-top:8px}.saveHint{color:#90a5b4;font-size:10px;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
    @media(max-width:1150px){main{grid-template-columns:280px minmax(400px,1fr)}.inspector{grid-column:1/-1;max-height:none}.inspector form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px}.inspectorHead,.roleNote{grid-column:1/-1}}
    @media(max-width:760px){header{height:auto;min-height:64px;padding:8px 10px;gap:8px;flex-wrap:wrap}.actions{gap:4px}.actions button{padding:6px;font-size:10px}main{grid-template-columns:1fr;padding:8px}.listPanel{max-height:300px}.preview{min-height:0}.inspector{grid-column:auto}.inspector form{display:block}}

<body>
  <header>
    <div class="brand"><span>L</span>ADID <small style="color:#708596;font-weight:500;letter-spacing:.04em">/ ALL ELEMENTS EDITOR</small></div>
    <div class="actions"><button id="importBtn">설정 불러오기</button><button id="resetBtn">기본값</button><button class="primary" id="saveBtn">JSON 저장</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div>
  </header>
  <main>
    <section class="panel listPanel">
      <div class="panelTitle">메뉴 요소</div><p class="hint">텍스트, 버튼, 배경, 설정창의 모든 요소를 선택해 편집합니다.</p>
      <label class="globalColor">전역 강조 색상<input id="globalAccent" type="color" value="#55d6ff"></label>
      <select class="mode" id="previewMode"><option value="main">메인 메뉴 미리보기</option><option value="settings">설정창 미리보기</option><option value="gameover">게임 오버 미리보기</option></select>
      <select class="elementSelect" id="elementSelect"></select>
      <div class="toolbar"><button id="addTextBtn">＋ 텍스트 상자</button><button id="deleteBtn" class="danger">선택 삭제</button></div>
      <div class="elementTree" id="elementTree"></div>
      <div class="hintLabel">미리보기 요소를 직접 끌어서 위치를 바꿀 수 있습니다.</div>
    </section>
    <section class="panel previewPanel">
      <div class="previewHead"><span>LIVE PREVIEW</span><span id="previewModeLabel">메인 메뉴</span></div>
      <div class="preview" id="preview"></div>
      <div class="saveHint">설정 적용: JSON 저장 후 <code>Assets/StreamingAssets/main-menu.json</code>에 덮어쓰고 Unity를 다시 실행하세요. 게임 오버 문구는 InPlay에서도 적용됩니다.</div>
    </section>
    <section class="panel inspector">
      <div class="panelTitle">선택한 요소</div>
      <div id="inspectorBody"><div class="empty">왼쪽 목록이나 미리보기에서 요소를 선택하세요.</div></div>
      <div class="status" id="status"></div>
    </section>
  </main>
  <script>
    const accentDefault="#55d6ff";
    const fontFamilies=["Malgun Gothic","Arial","Georgia","Courier New","Trebuchet MS","Verdana","Impact"];
    const make=(id,label,type,group,text,x,y,width,height,layer,extra={})=>({id,label,type,group,text,x,y,width,height,layer,fontSize:20,fontFamily:"Malgun Gothic",fontStyle:"Bold",textColor:"#FFFFFF",backgroundColor:"#000000",backgroundAlpha:0,alignment:"Center",verticalAlignment:"Middle",visible:true,interactable:false,useAccent:false,parentId:"",...extra});
    const defaultElements=[
      make("background","배경","image","main","",50,50,100,100,0,{backgroundColor:"#101923",backgroundAlpha:1}),
      make("topAccent","상단 강조선","image","main","",50,1,23.4,.42,2,{useAccent:true,backgroundAlpha:1}),

      make("titleUnderline","제목 밑줄","image","main","",50,39.3,5.94,.28,3,{useAccent:true,backgroundAlpha:.75}),

      make("startButtonAccent","시작 버튼 강조선","image","main","",36.45,48.1,.24,8.06,11,{useAccent:true,backgroundAlpha:1}),
      make("startButtonText","게임 시작 글자","text","main","게임 시작",50,48.1,27.34,8.06,12,{fontSize:20}),
      make("settingsButton","설정 버튼 배경","button","main","",50,58.6,27.34,8.06,10,{backgroundColor:"#080F17",backgroundAlpha:.96,interactable:true}),
      make("settingsButtonAccent","설정 버튼 강조선","image","main","",36.45,58.6,.24,8.06,11,{backgroundColor:"#25394A",backgroundAlpha:1}),
      make("settingsButtonText","설정 버튼 글자","text","main","설정",50,58.6,27.34,8.06,12,{fontSize:20}),

      make("quitButtonText","나가기 버튼 글자","text","main","게임 나가기",50,69.2,27.34,8.06,12,{fontSize:20}),
      make("footer","하단 설명","text","main","A SURVIVAL JOURNEY THROUGH COLLAPSING DIMENSIONS",50,96.7,70.3,3.3,3,{fontSize:12,fontFamily:"Arial",textColor:"#6E8A9E"}),
      make("settingsOverlay","설정창 어두운 배경","image","settings","",50,50,100,100,0,{backgroundColor:"#04070A",backgroundAlpha:.86}),
      make("settingsPanel","설정 패널","image","settings","",50,50,43.75,52.8,1,{backgroundColor:"#131C29",backgroundAlpha:1}),
      make("settingsAccent","설정 패널 상단선","image","settings","",50,24,43.75,.42,2,{useAccent:true,backgroundAlpha:1}),
      make("settingsTitle","설정 제목","text","settings","설정",50,31.7,35.9,7.6,3,{fontSize:34}),
      make("volumeLabel","볼륨 설명","text","settings","마스터 볼륨",40.7,43.5,21.1,4.2,3,{fontSize:18,alignment:"Left",textColor:"#D4E3EF"}),
      make("volumeSlider","볼륨 슬라이더","slider","settings","",52.7,49.3,19.5,2.22,4,{backgroundColor:"#212F3D",backgroundAlpha:1,interactable:true}),
      make("volumeSliderFill","볼륨 슬라이더 채움","sliderFill","settings","",0,50,100,42,5,{useAccent:true,backgroundAlpha:.72,parentId:"volumeSlider"}),
      make("volumeSliderHandle","볼륨 슬라이더 손잡이","sliderHandle","settings","",100,50,9.6,145,6,{backgroundColor:"#FFFFFF",backgroundAlpha:1,parentId:"volumeSlider"}),
      make("volumeValue","볼륨 값","text","settings","{value}%",66,49.3,4.3,3.9,7,{fontSize:15,fontFamily:"Arial",alignment:"Right",textColor:"#BACBD7"}),
      make("fullscreenToggle","전체 화면 토글","toggle","settings","",37,57.2,2.5,4.4,8,{backgroundColor:"#212F3D",backgroundAlpha:1,interactable:true}),
      make("fullscreenCheck","전체 화면 체크 표시","image","settings","",37,57.2,1.25,2.2,9,{useAccent:true,backgroundAlpha:1}),
      make("fullscreenLabel","전체 화면 설명","text","settings","전체 화면",53.5,57.2,20.3,4.7,9,{fontSize:18,alignment:"Left",textColor:"#D4E3EF"}),
      make("backButton","뒤로 버튼 배경","button","settings","",50,90.8,18,7.2,10,{backgroundColor:"#124057",backgroundAlpha:.96,interactable:true}),
      make("backButtonAccent","뒤로 버튼 강조선","image","settings","",41.1,90.8,.24,7.2,11,{useAccent:true,backgroundAlpha:1}),
      make("backButtonText","뒤로 버튼 글자","text","settings","뒤로",50,90.8,18,7.2,12,{fontSize:20}),
      make("gameOverTitle","게임 오버 제목","text","gameover","GAME OVER",50,39.3,40.6,8.1,2,{fontSize:38}),
      make("gameOverSubtitle","게임 오버 안내","text","gameover","차원에서 버텼습니다. 다시 도전하거나 메인 메뉴로 돌아가세요.",50,47.2,40.6,4.7,2,{fontSize:15,textColor:"#B8D1E3"}),
      make("gameOverRestartText","다시 시작 버튼 글자","text","gameover","다시 시작",41,60.4,16,7.2,4,{fontSize:19}),
      make("gameOverMenuText","메인 메뉴 버튼 글자","text","gameover","메인 메뉴",59,60.4,16,7.2,4,{fontSize:19})
    ];
    let elements=defaultElements.map(element=>({...element})),selectedId="title",previewMode="main",dragState=null,customCounter=1,previewVolume=1,previewFullscreen=false;
    const preview=document.getElementById("preview"),tree=document.getElementById("elementTree"),selector=document.getElementById("elementSelect"),inspector=document.getElementById("inspectorBody");
    function clamp(value,min,max){return Math.max(min,Math.min(max,value));}
    function alphaColor(hex,alpha){const match=/^#?([0-9a-f]{6})$/i.exec(hex||"");if(!match)return `rgba(0,0,0,${alpha})`;const value=parseInt(match[1],16);return `rgba(${value>>16},${(value>>8)&255},${value&255},${clamp(Number(alpha)||0,0,1)})`;}
    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));}
    function getElement(id){return elements.find(element=>element.id===id);}
    function getSelected(){return getElement(selectedId)||elements[0];}
    function optionLabel(element){return `${element.group==="settings"?"⚙ ":element.group==="gameover"?"☠ ":"▰ "}${element.label} · ${element.type}`;}
    function updateSelectionLists(){selector.replaceChildren();tree.replaceChildren();for(const element of elements){const option=document.createElement("option");option.value=element.id;option.textContent=optionLabel(element);selector.appendChild(option);const button=document.createElement("button");button.className="elementOption"+(element.id===selectedId?" selected":"");button.innerHTML=`<span>${escapeHtml(element.label)}</span><small>${element.visible?"표시":"숨김"}</small>`;button.addEventListener("click",()=>selectElement(element.id));tree.appendChild(button);}selector.value=selectedId;document.getElementById("deleteBtn").disabled=!selectedId.startsWith("custom_");}
    function selectElement(id){selectedId=id;const element=getSelected();if(element)previewMode=element.group;document.getElementById("previewMode").value=previewMode;updateSelectionLists();renderInspector();renderPreview();}
    function addField(form,label,control,full=false){const wrapper=document.createElement("label");wrapper.className="formField"+(full?" full":"");wrapper.append(document.createTextNode(label),control);form.appendChild(wrapper);return control;}
    function makeInput(type,value,min,max,step){const input=document.createElement("input");input.type=type;if(value!==undefined)input.value=value;if(min!==undefined)input.min=min;if(max!==undefined)input.max=max;if(step!==undefined)input.step=step;return input;}
    function makeSelect(options,value){const select=document.createElement("select");for(const item of options){const option=document.createElement("option");option.value=item[0];option.textContent=item[1];select.appendChild(option);}select.value=value;return select;}
    function addPositionStyle(node,element,parentRect){node.style.left=element.x+"%";node.style.top=element.y+"%";node.style.width=element.width+"%";node.style.height=element.height+"%";node.style.zIndex=String(element.layer);node.style.backgroundColor=alphaColor(element.useAccent?document.getElementById("globalAccent").value:element.backgroundColor,element.backgroundAlpha);}
    function makeNode(element,parent){const node=document.createElement("div");node.className="previewElement"+(element.type==="button"?" buttonElement":"")+(element.id===selectedId?" selected":"");node.dataset.id=element.id;node.title=element.label;addPositionStyle(node,element);if(element.type==="text"){node.textContent=element.id==="volumeValue"?element.text.replace("{value}",Math.round(previewVolume*100)):element.text;node.style.color=element.textColor;node.style.fontFamily=`"${element.fontFamily}",sans-serif`;node.style.fontSize=`${element.fontSize*preview.clientHeight/720}px`;node.style.fontWeight=element.fontStyle.includes("Bold")?"700":"400";node.style.fontStyle=element.fontStyle.includes("Italic")?"italic":"normal";node.style.textAlign=element.alignment.toLowerCase();node.style.justifyContent=element.alignment==="Left"?"flex-start":element.alignment==="Right"?"flex-end":"center";node.style.alignItems=element.verticalAlignment==="Top"?"flex-start":element.verticalAlignment==="Bottom"?"flex-end":"center";}if(element.type==="slider"){node.classList.add("sliderElement");const fill=getElement("volumeSliderFill"),handle=getElement("volumeSliderHandle");for(const [part,isHandle] of [[fill,false],[handle,true]])if(part&&part.visible){const child=document.createElement("div");child.className="sliderPreviewPart"+(isHandle?" sliderPreviewHandle":"")+(part.id===selectedId?" selected":"");child.dataset.id=part.id;child.style.left=(isHandle?previewVolume*100:part.x)+"%";child.style.top=part.y+"%";child.style.width=part.width+"%";child.style.height=part.height+"%";child.style.backgroundColor=alphaColor(part.useAccent?document.getElementById("globalAccent").value:part.backgroundColor,part.backgroundAlpha);child.style.zIndex=String(part.layer+10);node.appendChild(child);attachDrag(child,part,true);}}if(element.type==="toggle"){node.style.border="1px solid #607789";if(element.id==="fullscreenToggle"&&previewFullscreen){node.textContent="✓";node.style.color=document.getElementById("globalAccent").value;}node.addEventListener("click",()=>{if(element.id==="fullscreenToggle"){previewFullscreen=!previewFullscreen;renderPreview();}});}attachDrag(node,element,false);parent.appendChild(node);return node;}
    function attachDrag(node,element,isLocal){node.addEventListener("pointerdown",event=>{if(event.button!==undefined&&event.button!==0)return;event.preventDefault();event.stopPropagation();selectedId=element.id;updateSelectionLists();renderInspector();for(const item of preview.querySelectorAll("[data-id]"))item.classList.toggle("selected",item.dataset.id===selectedId);if(element.type==="sliderHandle")return;dragState={id:element.id,pointerId:event.pointerId,local:isLocal};node.setPointerCapture(event.pointerId);});node.addEventListener("pointermove",event=>{if(!dragState||dragState.id!==element.id||dragState.pointerId!==event.pointerId)return;let bounds=preview.getBoundingClientRect();if(element.parentId){const parentNode=preview.querySelector(`[data-id="${element.parentId}"]`);if(parentNode)bounds=parentNode.getBoundingClientRect();}element.x=clamp((event.clientX-bounds.left)/bounds.width*100,0,100);element.y=clamp((event.clientY-bounds.top)/bounds.height*100,0,100);node.style.left=element.x+"%";node.style.top=element.y+"%";const xInput=inspector.querySelector('[data-prop="x"]'),yInput=inspector.querySelector('[data-prop="y"]');if(xInput)xInput.value=element.x.toFixed(1);if(yInput)yInput.value=element.y.toFixed(1);});const finish=event=>{if(dragState&&dragState.id===element.id&&dragState.pointerId===event.pointerId)dragState=null;};node.addEventListener("pointerup",finish);node.addEventListener("pointercancel",finish);}
    function renderPreview(){preview.style.setProperty("--accent",document.getElementById("globalAccent").value);preview.classList.toggle("gameOverPreview",previewMode==="gameover");preview.replaceChildren();document.getElementById("previewModeLabel").textContent=previewMode==="main"?"메인 메뉴":previewMode==="settings"?"설정 창":"게임 오버";if(previewMode==="gameover"){const decor=document.createElement("div");decor.className="gameOverDecor";const panel=document.createElement("div");panel.className="gameOverDecorPanel";decor.appendChild(panel);const left=document.createElement("div");left.className="gameOverDecorButton left";const right=document.createElement("div");right.className="gameOverDecorButton right";decor.append(left,right);preview.appendChild(decor);}const visible=elements.filter(element=>element.group===previewMode&&element.visible&&(element.id!=="fullscreenCheck"||previewFullscreen)).sort((a,b)=>a.layer-b.layer);for(const element of visible){if(element.type==="sliderFill"||element.type==="sliderHandle")continue;makeNode(element,preview);}updateSelectionLists();}
    function renderInspector(){const element=getSelected();if(!element)return;inspector.replaceChildren();const head=document.createElement("div");head.className="inspectorHead";const title=document.createElement("strong");title.textContent=element.label;head.appendChild(title);const del=document.createElement("button");del.className="danger";del.textContent="삭제";del.hidden=!element.id.startsWith("custom_");del.addEventListener("click",deleteSelected);head.appendChild(del);inspector.appendChild(head);const form=document.createElement("form");form.addEventListener("submit",event=>event.preventDefault());inspector.appendChild(form);
      addField(form,"표시 이름",bindControl(makeInput("text",element.label),"label",element));if(!["sliderFill","sliderHandle"].includes(element.type))addField(form,"그룹",bindControl(makeSelect([["main","메인 메뉴"],["settings","설정 창"],["gameover","게임 오버"]],element.group),"group",element));const visible=bindControl(makeInput("checkbox"),"visible",element);visible.checked=element.visible;const visibleLabel=document.createElement("label");visibleLabel.className="checkField";visibleLabel.append(visible,document.createTextNode("화면에 표시"));form.appendChild(visibleLabel);
      if(element.type==="text")addField(form,"텍스트 내용",bindControl(Object.assign(document.createElement("textarea"),{value:element.text}),"text",element),true);
      const positions=document.createElement("div");positions.className="twoCol";form.appendChild(positions);for(const [key,label] of [["x","가로 위치 %"],["y","세로 위치 %"],["width","너비 %"],["height","높이 %"]]){if(element.type==="sliderHandle"&&key==="x")continue;addField(positions,label,bindControl(makeInput("number",element[key],0,100,.1),key,element,"number"));}
      addField(form,"레이어 순서",bindControl(makeInput("number",element.layer,-100,100,1),"layer",element,"number"));const colors=document.createElement("div");colors.className="twoCol";form.appendChild(colors);const bg=bindControl(makeInput("color",element.backgroundColor),"backgroundColor",element);bg.disabled=element.useAccent;addField(colors,"배경 색",bg);addField(colors,"배경 투명도",bindControl(makeInput("number",element.backgroundAlpha,0,1,.01),"backgroundAlpha",element,"number"));const useAccent=bindControl(makeInput("checkbox"),"useAccent",element);useAccent.checked=element.useAccent;const useAccentLabel=document.createElement("label");useAccentLabel.className="checkField";useAccentLabel.append(useAccent,document.createTextNode("전역 강조 색상 사용"));form.appendChild(useAccentLabel);
      if(element.type==="text"){const typography=document.createElement("div");typography.className="twoCol";form.appendChild(typography);addField(typography,"폰트",bindControl(makeSelect(fontFamilies.map(name=>[name,name]),element.fontFamily),"fontFamily",element));addField(typography,"폰트 스타일",bindControl(makeSelect([["Normal","보통"],["Bold","굵게"],["Italic","기울임"],["BoldAndItalic","굵게+기울임"]],element.fontStyle),"fontStyle",element));addField(typography,"글자 크기",bindControl(makeInput("number",element.fontSize,8,120,1),"fontSize",element,"number"));addField(typography,"글자 색",bindControl(makeInput("color",element.textColor),"textColor",element));addField(typography,"가로 정렬",bindControl(makeSelect([["Left","왼쪽"],["Center","가운데"],["Right","오른쪽"]],element.alignment),"alignment",element));addField(typography,"세로 정렬",bindControl(makeSelect([["Top","위"],["Middle","가운데"],["Bottom","아래"]],element.verticalAlignment),"verticalAlignment",element));}
      if(["button","slider","toggle"].includes(element.type)){const interact=bindControl(makeInput("checkbox"),"interactable",element);interact.checked=element.interactable;const label=document.createElement("label");label.className="checkField";label.append(interact,document.createTextNode("기능 활성화"));form.appendChild(label);}
      if(element.type==="button"){const note=document.createElement("div");note.className="roleNote";note.textContent=`기능 연결은 고정되어 있습니다. 버튼의 글자는 별도의 텍스트 요소에서 수정하세요.`;form.appendChild(note);}if(element.type==="sliderHandle"){const note=document.createElement("div");note.className="roleNote";note.textContent="손잡이의 가로 위치는 볼륨 값에 따라 움직입니다. 세로 위치와 크기는 조정할 수 있습니다.";form.appendChild(note);}
    }
    function bindControl(control,key,element,type){control.dataset.prop=key;const update=()=>{element[key]=control.type==="checkbox"?control.checked:type==="number"?Number(control.value):control.value;if(key==="backgroundColor"){element.useAccent=false;const toggle=inspector.querySelector('[data-prop="useAccent"]');if(toggle)toggle.checked=false;control.disabled=false;}if(key==="useAccent"){const picker=inspector.querySelector('[data-prop="backgroundColor"]');if(picker)picker.disabled=element.useAccent;if(element.useAccent)element.backgroundColor=document.getElementById("globalAccent").value;}if(key==="label")updateSelectionLists();if(key==="group")previewMode=element.group,document.getElementById("previewMode").value=previewMode;if(element.id==="volumeLabel"||element.id==="settingsPanel"){fitVolumeLabel();if(element.id==="volumeLabel"){for(const prop of ["x","width"]){const field=inspector.querySelector(`[data-prop="${prop}"]`);if(field)field.value=element[prop].toFixed(1);}}}renderPreview();};control.addEventListener("input",update);control.addEventListener("change",update);return control;}
    function deleteSelected(){if(!selectedId.startsWith("custom_"))return;elements=elements.filter(element=>element.id!==selectedId);selectedId=elements[0].id;renderInspector();renderPreview();}
    function addCustomText(){let id;do{id="custom_"+customCounter++;}while(getElement(id));elements.push(make(id,"새 텍스트","text",previewMode,"새 텍스트",50,50,30,10,30,{fontSize:24,fontFamily:"Malgun Gothic",textColor:"#FFFFFF",backgroundAlpha:0}));selectElement(id);}
    function mergeImported(data){if(!Array.isArray(data.elements)){const merged=defaultElements.map(item=>({...item}));const oldFields={title:"title",subtitle:"subtitle",startLabel:"startButtonText",settingsLabel:"settingsButtonText",quitLabel:"quitButtonText",settingsTitle:"settingsTitle",volumeLabel:"volumeLabel",fullscreenLabel:"fullscreenLabel",backLabel:"backButtonText"};for(const [key,id] of Object.entries(oldFields)){const source=data[key],target=merged.find(item=>item.id===id);if(source!==undefined&&target)target.text=source;}for(const [source,id,sizeKey,fontKey] of [["title","title","titleFontSize","titleFontFamily"],["subtitle","subtitle","subtitleFontSize","subtitleFontFamily"],["startLabel","startButtonText","buttonFontSize","buttonFontFamily"],["settingsLabel","settingsButtonText","buttonFontSize","buttonFontFamily"],["quitLabel","quitButtonText","buttonFontSize","buttonFontFamily"],["backLabel","backButtonText","buttonFontSize","buttonFontFamily"]]){const target=merged.find(item=>item.id===id);if(target){if(data[sizeKey])target.fontSize=data[sizeKey];if(data[fontKey])target.fontFamily=data[fontKey];}}if(Array.isArray(data.textBoxes))for(const box of data.textBoxes)merged.push(make("custom_"+customCounter++,"추가 텍스트","text","main",box.text||"",box.x||50,box.y||50,box.width||36,box.height||10,30,{fontSize:box.fontSize||24,fontFamily:box.fontFamily||"Malgun Gothic",textColor:box.color||"#FFFFFF",alignment:box.alignment||"Center"}));return{accentColor:data.accentColor||accentDefault,elements:merged};}const merged=defaultElements.map(base=>({...base,...(data.elements.find(item=>item.id===base.id)||{})}));for(const item of data.elements)if(!merged.some(existing=>existing.id===item.id))merged.push({...item});return{accentColor:data.accentColor||accentDefault,elements:merged};}
    function fitVolumeLabel(){const panel=getElement("settingsPanel"),label=getElement("volumeLabel");if(!panel||!label)return;const inset=2;label.width=Math.min(label.width,Math.max(1,panel.width-inset*2));label.x=clamp(label.x,panel.x-panel.width/2+inset+label.width/2,panel.x+panel.width/2-inset-label.width/2);}
    function loadData(data){const merged=mergeImported(data);elements=merged.elements;fitVolumeLabel();document.getElementById("globalAccent").value=merged.accentColor;for(const element of elements)if(element.useAccent)element.backgroundColor=merged.accentColor;selectedId=elements.find(element=>element.id==="title")?.id||elements[0]?.id||"title";previewMode=getSelected()?.group||"main";document.getElementById("previewMode").value=previewMode;renderInspector();renderPreview();}
    function exportData(){return{accentColor:document.getElementById("globalAccent").value,elements:elements};}
    selector.addEventListener("change",()=>selectElement(selector.value));document.getElementById("previewMode").addEventListener("change",event=>{previewMode=event.target.value;renderPreview();});document.getElementById("globalAccent").addEventListener("input",event=>{for(const element of elements)if(element.useAccent)element.backgroundColor=event.target.value;const selected=getSelected();if(selected?.useAccent){const picker=inspector.querySelector('[data-prop="backgroundColor"]');if(picker)picker.value=event.target.value;}renderPreview();});document.getElementById("addTextBtn").addEventListener("click",addCustomText);document.getElementById("deleteBtn").addEventListener("click",deleteSelected);
    document.getElementById("saveBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(exportData(),null,2)+"\n"],{type:"application/json"});const url=URL.createObjectURL(blob);const anchor=document.createElement("a");anchor.href=url;anchor.download="main-menu.json";anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById("status").textContent="main-menu.json을 저장했습니다.";});
    document.getElementById("resetBtn").addEventListener("click",()=>{elements=defaultElements.map(element=>({...element}));selectedId="title";previewMode="main";document.getElementById("previewMode").value=previewMode;document.getElementById("globalAccent").value=accentDefault;renderInspector();renderPreview();});document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("fileInput").click());document.getElementById("fileInput").addEventListener("change",async event=>{const file=event.target.files[0];if(!file)return;try{loadData(JSON.parse(await file.text()));document.getElementById("status").textContent=file.name+"을 불러왔습니다.";}catch(error){document.getElementById("status").textContent="설정 파일을 읽지 못했습니다.";}event.target.value="";});window.addEventListener("resize",renderPreview);
    loadData({accentColor:accentDefault,elements:defaultElements});
  </script>
</body>
